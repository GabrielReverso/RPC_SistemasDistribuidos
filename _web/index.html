<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Slot Machine</title>
    <link href="styles.css" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="/favicon.png" />
</head>

<body>
    <div id="app">
        <main id="slot-machine">
            <div id="sm-bg-decor"></div>
            <div class="sm-frame-wrapper">
                <div class="shadow">
                    <div id="sm-frame-decor">
                        <span class="left"></span>
                        <div class="display">
                            <p>JACKPOT</p>
                        </div>
                        <span class="right"></span>
                    </div>
                    <div id="sm-frame">
                        <section id="sm-slots-frame">
                            <div id="sm-slots">
                                <span class="slot">🍒</span>
                                <span class="slot">🍒</span>
                                <span class="slot">🍒</span>
                            </div>
                        </section>
                    </div>
                </div>
                <div class="base-wrapper">
                    <div id="sm-keyboard"></div>
                    <div id="sm-keyboard-height"></div>
                </div>
                <div id="sm-base"></div>
                <div id="floor"></div>
            </div>
            <aside id="lever-wrapper">
                <div id="lever-base"></div>
                <div id="lever">
                </div>
            </aside>
            <button id="lever-handle"></button>
        </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
