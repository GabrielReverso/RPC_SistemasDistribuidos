<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Slot Machine</title>
    <link href="styles.css" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="/favicon.png" />
</head>

<body>
    <div id="app">
        <aside id="config">
            <menu>
                <div>
                    <p>Money</p>
                    <hr>
                    <div class="row">
                        <input type="number" min="0">
                        <button>Add</button>
                    </div>
                    <p class="control">Current: <span>$</span><span id="current-money"></span></p>
                </div>
                <div>
                    <p>Bet value</p>
                    <hr>
                    <div class="row">
                        <input type="number" min="0">
                        <button>Set bet</button>
                    </div>
                    <p class="control">Current: <span>$</span><span id="current-bet"></span></p>
                </div>
                <div>
                    <ul>
                        Odds
                        <hr>
                        <li>JACKPOT: <span>0.0125%</span></li>
                        <li>2 OF A KIND: <span>14.25%</span></li>
                    </ul>
                </div>
            </menu>
            <button id="menu-handler">⚙️</button>
        </aside>
        <main id="slot-machine">
            <div id="sm-bg-decor"></div>
            <div class="sm-frame-wrapper">
                <div class="shadow">
                    <div id="sm-frame-decor">
                        <span class="left"></span>
                        <div class="display">
                            <p>JACKPOT</p>
                        </div>
                        <span class="right"></span>
                    </div>
                    <div id="sm-frame">
                        <section id="sm-slots-frame">
                            <div id="sm-slots">
                                <span class="slot">🍒</span>
                                <span class="slot">🍒</span>
                                <span class="slot">🍒</span>
                            </div>
                        </section>
                    </div>
                </div>
                <div class="base-wrapper">
                    <div id="sm-keyboard"></div>
                    <div id="sm-keyboard-height"></div>
                </div>
                <div id="sm-base"></div>
                <div id="floor"></div>
            </div>
            <aside id="lever-wrapper">
                <div id="lever-base"></div>
                <div id="lever">
                </div>
            </aside>
            <button id="lever-handle"></button>
            <p id="tooltip" class="none">PRESS TO START</p>
        </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
